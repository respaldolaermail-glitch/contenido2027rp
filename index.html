<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Material para la Enseñanza</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* CABECERA */
        header {
            height: 85px;
            display: flex;
            align-items: center;
            padding: 0 35px;
            border-bottom: 1px solid #2b2b2b;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* ESTRUCTURA GENERAL */
        .contenedor {
            display: flex;
            min-height: calc(100vh - 85px);
        }

        /* MENÚ LATERAL */
        aside {
            width: 260px;
            padding: 30px 20px;
            border-right: 1px solid #2b2b2b;
            flex-shrink: 0;
        }

        .menu-titulo {
            font-size: 0.75rem;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 20px 10px;
        }

        .asignatura {
            margin-bottom: 8px;
        }

        .asignatura-boton {
            width: 100%;
            background: transparent;
            color: #ffffff;
            border: none;
            border-radius: 7px;
            padding: 15px 12px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 1rem;
            cursor: pointer;

            transition: background-color 0.2s ease;
        }

        .asignatura-boton:hover {
            background-color: #171717;
        }

        .nombre-asignatura {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .anio {
            color: #777777;
            font-size: 0.85rem;
        }

        /* SUBMENÚ MESES */
        .meses {
            display: none;
            padding: 5px 0 10px 18px;
        }

        .meses.activo {
            display: block;
        }

        .mes {
            display: block;
            width: 100%;
            padding: 9px 12px;

            background: transparent;
            border: none;
            border-left: 1px solid #333333;

            color: #aaaaaa;
            text-align: left;
            font-size: 0.9rem;

            cursor: pointer;
            transition: 0.2s;
        }

        .mes:hover {
            color: #ffffff;
            border-left-color: #ffffff;
            background-color: #111111;
        }

        /* CONTENIDO CENTRAL */
        main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px;
        }

        .bienvenida {
            max-width: 720px;
            text-align: center;
        }

        .bienvenida h2 {
            font-size: 2.3rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .bienvenida p {
            color: #aaaaaa;
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 0 auto;
        }

        .linea {
            width: 50px;
            height: 2px;
            background-color: #ffffff;
            margin: 30px auto;
        }

        /* CELULAR */
        @media (max-width: 700px) {

            header {
                height: auto;
                padding: 25px;
            }

            header h1 {
                font-size: 1.4rem;
            }

            .contenedor {
                flex-direction: column;
            }

            aside {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #2b2b2b;
                padding: 20px;
            }

            main {
                padding: 50px 25px;
                min-height: 400px;
            }

            .bienvenida h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- CABECERA -->
    <header>
        <h1>Material para la Enseñanza</h1>
    </header>


    <div class="contenedor">

        <!-- MENÚ LATERAL -->
        <aside>

            <p class="menu-titulo">Asignaturas</p>


            <!-- IMECA -->
            <div class="asignatura">

                <button class="asignatura-boton"
                        onclick="abrirMenu('imeca')">

                    <span class="nombre-asignatura">IMECA</span>
                    <span class="anio">2027</span>

                </button>

                <div class="meses" id="imeca">
                    <button class="mes">Marzo</button>
                    <button class="mes">Abril</button>
                    <button class="mes">Mayo</button>
                    <button class="mes">Junio</button>
                    <button class="mes">Julio</button>
                    <button class="mes">Agosto</button>
                    <button class="mes">Septiembre</button>
                    <button class="mes">Octubre</button>
                    <button class="mes">Noviembre</button>
                </div>

            </div>


            <!-- MMES -->
            <div class="asignatura">

                <button class="asignatura-boton"
                        onclick="abrirMenu('mmes')">

                    <span class="nombre-asignatura">MMES</span>
                    <span class="anio">2027</span>

                </button>

                <div class="meses" id="mmes">
                    <button class="mes">Marzo</button>
                    <button class="mes">Abril</button>
                    <button class="mes">Mayo</button>
                    <button class="mes">Junio</button>
                    <button class="mes">Julio</button>
                    <button class="mes">Agosto</button>
                    <button class="mes">Septiembre</button>
                    <button class="mes">Octubre</button>
                    <button class="mes">Noviembre</button>
                </div>

            </div>


            <!-- IEI -->
            <div class="asignatura">

                <button class="asignatura-boton"
                        onclick="abrirMenu('iei')">

                    <span class="nombre-asignatura">IEI</span>
                    <span class="anio">2027</span>

                </button>

                <div class="meses" id="iei">
                    <button class="mes">Marzo</button>
                    <button class="mes">Abril</button>
                    <button class="mes">Mayo</button>
                    <button class="mes">Junio</button>
                    <button class="mes">Julio</button>
                    <button class="mes">Agosto</button>
                    <button class="mes">Septiembre</button>
                    <button class="mes">Octubre</button>
                </div>

            </div>


            <!-- ISCEI -->
            <div class="asignatura">

                <button class="asignatura-boton"
                        onclick="abrirMenu('iscei')">

                    <span class="nombre-asignatura">ISCEI</span>
                    <span class="anio">2027</span>

                </button>

                <div class="meses" id="iscei">
                    <button class="mes">Marzo</button>
                    <button class="mes">Abril</button>
                    <button class="mes">Mayo</button>
                    <button class="mes">Junio</button>
                    <button class="mes">Julio</button>
                    <button class="mes">Agosto</button>
                    <button class="mes">Septiembre</button>
                    <button class="mes">Octubre</button>
                </div>

            </div>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <main>

            <section class="bienvenida">

                <h2>Material para la Enseñanza</h2>

                <div class="linea"></div>

                <p>
                    Este espacio reúne material destinado a apoyar
                    la enseñanza del maestro y el aprendizaje del estudiante.
                    Seleccione una asignatura para acceder a los contenidos
                    organizados por mes.
                </p>

            </section>

        </main>

    </div>


    <script>

        function abrirMenu(id) {

            const menuSeleccionado =
                document.getElementById(id);

            const estabaAbierto =
                menuSeleccionado.classList.contains('activo');

            /* Cerrar todos los submenús */
            document.querySelectorAll('.meses')
                .forEach(menu => {
                    menu.classList.remove('activo');
                });

            /* Abrir solamente el seleccionado */
            if (!estabaAbierto) {
                menuSeleccionado.classList.add('activo');
            }

        }

    </script>

</body>
</html>
